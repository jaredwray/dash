# Local warehouse clusters for adapter tests.
# Start with `pnpm test:services:start` and stop with `pnpm test:services:stop`.
# Each service is one cluster endpoint. Add the next warehouse beside postgres
# when its adapter lands, and point that package's tests at the published port.

name: dash-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: dash-test-postgres
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "127.0.0.1:${DASH_TEST_POSTGRES_PORT:-54329}:5432"
    volumes:
      - dash-test-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # pg_isready is true during the entrypoint's temporary server, before
    # fixture SQL runs. Require a fixture view so --wait means the cluster
    # is actually queryable.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dash -d dash && psql -U dash -d dash -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM public.paid_orders LIMIT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  mongodb:
    image: mongo:7.0
    container_name: dash-test-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: dash
      MONGO_INITDB_ROOT_PASSWORD: dash
      MONGO_INITDB_DATABASE: dash
    ports:
      - "127.0.0.1:${DASH_TEST_MONGODB_PORT:-27029}:27017"
    volumes:
      - dash-test-mongodb:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    # Require the fixture view so --wait means init scripts have finished
    # and the authenticated server is queryable. countDocuments() is async.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet 'mongodb://dash:dash@127.0.0.1:27017/dash?authSource=admin' --eval 'if ((await db.revenue.countDocuments()) !== 3 || (await db.paid_orders.countDocuments()) !== 3) quit(1)'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  dash-test-postgres:
  dash-test-mongodb:
