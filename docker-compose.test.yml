# Local warehouse clusters for adapter tests.
# Start with `pnpm test:services:start` and stop with `pnpm test:services:stop`.
# Each service is one cluster endpoint. Add the next warehouse beside postgres
# when its adapter lands, and point that package's tests at the published port.

name: dash-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: dash-test-postgres
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "127.0.0.1:${DASH_TEST_POSTGRES_PORT:-54329}:5432"
    volumes:
      - dash-test-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # pg_isready is true during the entrypoint's temporary server, before
    # fixture SQL runs. Require a fixture view so --wait means the cluster
    # is actually queryable.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dash -d dash && psql -U dash -d dash -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM public.paid_orders LIMIT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  dash-test-postgres:
