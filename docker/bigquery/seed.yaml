# Fixture warehouse for @dash/adapter-bigquery.
# Loaded when the emulator starts. Rows match docker/postgres/init and docker/mongodb/init.
projects:
  - id: dash
    datasets:
      - id: analytics
        tables:
          - id: orders
            columns:
              - name: id
                type: INTEGER
                mode: REQUIRED
              - name: total
                type: INTEGER
                mode: REQUIRED
              - name: status
                type: STRING
                mode: REQUIRED
              - name: region
                type: STRING
                mode: NULLABLE
              - name: note
                type: STRING
                mode: NULLABLE
            data:
              - id: 1
                total: 10
                status: paid
                region: Europe
                note: first
              - id: 2
                total: 25
                status: paid
                region: Europe
              - id: 3
                total: 5
                status: open
                region: Asia Pacific
                note: third
              - id: 4
                total: 40
                status: paid
                region: North America
          - id: revenue
            columns:
              - name: month
                type: STRING
                mode: REQUIRED
              - name: amount
                type: INTEGER
                mode: REQUIRED
            data:
              - month: "2026-01"
                amount: 10
              - month: "2026-02"
                amount: 20
              - month: "2026-03"
                amount: 15
